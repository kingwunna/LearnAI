stem-ui,sans-serif;color:var(--green);min-width:22px}.matrix{display:grid;gap:12px}.matrix-row{display:grid;grid-template-columns:minmax(0,1fr) minmax(190px,.8fr);gap:16px;align-items:center;padding:12px 0;border-bottom:1px solid #e8ebe5}.matrix-statement{font-size:1.04rem;line-height:1.45}.matrix-index{font:800 .68rem ui-sans-serif,system-ui,sans-serif;color:var(--coral);margin-right:8px}.matrix-select,.blank-input{width:100%;min-height:44px;padding:9px 12px;border:1px solid #cbd5cb;border-radius:6px;background:#fff;color:var(--ink)}.blank-input{font-size:1rem}.blank-wrap{display:flex;gap:10px;align-items:center;max-width:500px}.blank-input{flex:1}.answer-key{font: .74rem ui-sans-serif,system-ui,sans-serif;color:var(--muted);white-space:nowrap}.feedback{margin-top:20px;padding:14px 16px;border-left:3px solid var(--green);background:var(--green-soft);line-height:1.55}.feedback.incorrect{border-color:var(--coral);background:var(--coral-soft)}.feedback strong{font-family:ui-sans-serif,system-ui,sans-serif;font-size:.87rem}.feedback p{margin:6px 0 0}.card-actions{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:25px}.button{border:1px solid var(--line);border-radius:6px;min-height:43px;padding:9px 14px;background:#fff;color:var(--ink);font:800 .82rem ui-sans-serif,system-ui,sans-serif}.button:hover:not(:disabled){border-color:var(--green);transform:translateY(-1px)}.button.primary{background:var(--green);border-color:var(--green);color:white}.button:disabled{opacity:.4;cursor:not-allowed}.action-group{display:flex;gap:8px}.navigator{padding:17px}.navigator h2{font-size:1rem;font-weight:600;margin:0 0 4px}.navigator p{font: .75rem/1.4 ui-sans-serif,system-ui,sans-serif;color:var(--muted);margin:0 0 13px}.number-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}.number-button{aspect-ratio:1;border:1px solid var(--line);border-radius:5px;background:#fff;color:var(--muted);font:700 .75rem ui-sans-serif,system-ui,sans-serif}.number-button.current{outline:2px solid var(--blue);outline-offset:1px;color:var(--blue)}.number-button.done{background:var(--green-soft);border-color:#b3cdb8;color:var(--green)}.number-button.missed{background:var(--coral-soft);border-color:#e4b9ae;color:#994938}.scoreline{margin-top:16px;padding-top:13px;border-top:1px solid var(--line);display:flex;justify-content:space-between;font: .78rem ui-sans-serif,system-ui,sans-serif}.scoreline strong{color:var(--green)}.completion{padding:clamp(22px,5vw,44px);margin-top:15px}.completion h2{font-size:2rem;font-weight:500;margin:4px 0 8px}.completion>p{font: .9rem/1.55 ui-sans-serif,system-ui,sans-serif;color:var(--muted)}.result-number{font-size:3.7rem;line-height:1;margin:18px 0 3px}.review-list{display:grid;gap:8px;margin:20px 0}.review-item{padding:13px 15px;border:1px solid var(--line);border-radius:6px;background:#fff}.review-item summary{cursor:pointer;font-weight:600;line-height:1.4}.review-item p{font: .85rem/1.5 ui-sans-serif,system-ui,sans-serif;color:var(--muted);margin:10px 0 0}.review-item .right{color:var(--green);font-weight:700}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}

@media(max-width:540px){.app{width:calc(100% - 22px);padding-top:18px}.masthead{align-items:center}.chapter-mark{width:58px}.mode-tabs{gap:3px;padding:4px}.mode-tab{padding:7px 8px;font-size:.77rem;min-height:48px}.mode-tab span{font-size:.58rem}.question-card{padding:21px 16px}.matrix-row{grid-template-columns:1fr;gap:8px}.matrix-select{max-width:none}.number-grid{grid-template-columns:repeat(5,1fr)}.number-button{aspect-ratio:1.25}.card-actions{align-items:stretch}.action-group .button,.card-actions>.button{padding:8px 10px}.blank-wrap{align-items:stretch;flex-direction:column}.answer-key{white-space:normal}}

<script>
const BANK={
select:[
{q:"Which assumptions are fundamental to the ideal projectile model? Select all that apply.",o:["Air resistance and drag are negligible.","Horizontal acceleration is non-zero due to wind.","Gravity is constant and acts vertically downwards.","The projectile remains near Earth's surface, where the gravitational field is uniform."],a:[0,2,3],e:"The ideal model neglects air resistance, takes g as constant and downward, and assumes a uniform local gravitational field. Horizontal acceleration is zero."},
{q:"A projectile is launched at speed u and angle theta above horizontal. Which statements about its initial velocity are correct?",o:["ux = u cos(theta).","uy = u sin(theta).","theta = inverse tan(uy / ux).","u = sqrt(ux^2 + uy^2)."],a:[0,1,2,3],e:"Resolve the velocity into perpendicular components using cosine and sine. Recombine them with Pythagoras; the component ratio gives the angle."},
{q:"Which forces act on an ideal projectile after it has left the launcher?",o:["A continuing forward push from the launcher.","Gravity acting vertically downwards.","A centripetal force toward the center of the arc.","No horizontal force when air resistance is ignored."],a:[1,3],e:"After release, gravity is the only force in the ideal model. With no horizontal force, horizontal acceleration is zero."},
{q:"Which statements describe a projectile's acceleration throughout its trajectory, with up positive?",o:["Horizontal acceleration ax = 0.","Vertical acceleration ay = -9.8 m s^-2.","Total acceleration points vertically down at every point.","Vertical acceleration becomes zero at the apex."],a:[0,1,2],e:"Acceleration remains constant and downward throughout flight, including at the apex. Only vertical velocity is zero there."},
{q:"At the apex of a projectile launched at an angle above level ground, which statements are true?",o:["Vertical velocity vy is zero.","Horizontal velocity vx remains ux = u cos(theta).","The total velocity is zero.","Acceleration is perpendicular to velocity."],a:[0,1,3],e:"At the peak, the projectile still moves horizontally. Its velocity is horizontal while acceleration is vertical downward."},
{q:"For level-ground motion, which expressions for flight parameters are correct?",o:["t_flight = -2uy/g = 2u sin(theta)/9.8.","h = -uy^2/(2g) = (u sin(theta))^2/(2 x 9.8).","x_max = ux t_flight = u^2 sin(2theta)/9.8.","t_peak = t_flight/2 = -uy/g."],a:[0,1,2,3],e:"Each follows from constant-acceleration equations with g = -9.8 m s^-2 when upward is positive."},
{q:"Which statements about launch angle and level-ground range are true?",o:["Maximum range occurs at 45 degrees without air resistance.","Complementary launch angles give the same range at equal speeds.","A 90-degree launch gives maximum range.","The range is symmetric because sin(2(90 degrees - theta)) = sin(2theta)."],a:[0,1,3],e:"Range is proportional to sin(2theta), maximized at 45 degrees. Complementary angles have equal sine values; a vertical launch has zero range."},
{q:"How does air resistance affect a projectile compared with the ideal model?",o:["Maximum height is lower.","Horizontal range is reduced.","The descent becomes steeper than the ascent.","Horizontal velocity remains constant."],a:[0,1,2],e:"Drag reduces horizontal and vertical motion, lowering height and range and breaking the trajectory's symmetry."},
{q:"A projectile is launched from a cliff. Which statements are true?",o:["Time to peak t1 = -uy/g = u sin(theta)/9.8.","Descent time t2 from the peak satisfies -h = (1/2) g t2^2 if h is peak height above ground.","Total flight time is t1 + t2.","Landing speed always equals launch speed."],a:[0,1,2],e:"The flight can be split into ascent and descent. Landing below launch height gives a greater final speed in the ideal model."},
{q:"Which are common uncertainty sources in a projectile-motion investigation?",o:["Instrument reading limits.","Variation in launcher force between trials.","Human reaction time using a stopwatch.","Unmodelled air resistance."],a:[0,1,2,3],e:"Instrument precision, trial-to-trial variation, reaction time and model limitations can all contribute uncertainty."},
{q:"Which spreadsheet commands are correctly used in a projectile simulation?",o:["=RADIANS(B4) converts degrees to radians.","=25*COS(C4) gives horizontal velocity if C4 is radians.","=$A$6 keeps a cell reference fixed when copied.","=SQRT(B10*B10+C10*C10) finds velocity magnitude."],a:[0,1,2,3],e:"Spreadsheet trigonometric functions use radians; absolute references stay fixed, and SQRT computes vector magnitude."},
{q:"Which kinds of scientific models are used to analyze projectile motion?",o:["Mathematical models using 1D kinematics.","Visual models such as vector diagrams and trajectory curves.","Numerical spreadsheet simulations.","Relativistic quantum field models."],a:[0,1,2],e:"The chapter uses mathematical, graphical/visual and numerical simulation models."},
{q:"A ball is kicked horizontally off a roof. Which statements about its initial motion are correct?",o:["Initial vertical velocity uy is zero.","Initial horizontal velocity ux equals launch speed u.","Launch angle theta is 0 degrees.","It immediately has horizontal acceleration."],a:[0,1,2],e:"For a horizontal launch, theta is zero, so uy = 0 and ux = u. In the ideal model ax remains zero."},
{q:"If launch speed doubles at fixed angle over level ground, which quantities change as stated?",o:["Maximum height becomes four times greater.","Flight time doubles.","Horizontal range becomes four times greater.","Initial horizontal velocity doubles."],a:[0,1,2,3],e:"Height and range are proportional to u squared, while flight time and ux are proportional to u."},
{q:"For a projectile launched vertically upwards (theta = 90 degrees), which statements are correct?",o:["ux = 0 m s^-1.","Maximum height occurs when vy = 0.","Velocity and acceleration lie along the same vertical line during ascent and descent.","Horizontal range is zero."],a:[0,1,2,3],e:"Vertical launch has no horizontal motion. At the peak vy is zero; before and after it, velocity and acceleration are collinear (sometimes opposite in direction)."},
{q:"Which kinematic equations apply to horizontal projectile motion?",o:["x = ux t.","vx = ux.","x = ux t + (1/2) ax t^2, with ax = 0.","vx^2 = ux^2 + 2ax x, with ax = 0."],a:[0,1,2,3],e:"All constant-acceleration equations apply; setting ax to zero leaves constant horizontal velocity."},
{q:"With upward positive, which equations apply to vertical projectile motion?",o:["vy = uy + g t.","y = y0 + uy t + (1/2) g t^2.","vy^2 = uy^2 + 2g(y - y0).","y - y0 = (1/2)(uy + vy)t."],a:[0,1,2,3],e:"Vertical motion has constant acceleration g, so all standard 1D constant-acceleration equations apply."},
{q:"For a projectile landing at its launch height, which statements describe its final velocity?",o:["Its speed equals launch speed u.","Its horizontal component equals ux.","Its vertical component is -uy.","Its impact angle below horizontal equals launch angle above horizontal."],a:[0,1,2,3],e:"The ideal level-ground trajectory is symmetric: horizontal velocity is unchanged and vertical velocity reverses."},
{q:"In a horizontal-range ramp investigation, which principles are used to find the expected launch velocity?",o:["Convert gravitational potential energy to kinetic energy down the ramp.","Use desk drop height to calculate fall time t = sqrt(2h/9.8).","Use range and flight time to calculate ux = x/t.","Measure rotational torque of the ball bearing."],a:[0,1,2],e:"The method combines energy conservation, vertical free-fall time and horizontal range divided by flight time."},
{q:"Which ideas explain Galileo's parabolic projectile trajectory?",o:["Horizontal and vertical motion are independent.","Uniform horizontal motion combines with uniformly accelerated vertical motion.","Horizontal impetus continuously decays in the ideal model.","Combining x = ux t and y = (1/2)gt^2 gives a quadratic relation between y and x."],a:[0,1,3],e:"Eliminating time between independent horizontal and vertical equations gives a parabola. Galileo rejected the impetus explanation."}
],
matrix:[
{q:"Kinematic quantities during flight",intro:"Classify each statement as True or False.",rows:["Horizontal velocity vx changes continuously throughout flight.","Vertical velocity vy is zero at the peak.","Total acceleration is constant in magnitude and direction at all points.","Vertical displacement y is a linear function of time t."],opts:["True","False"],a:[1,0,0,1],e:"Horizontal velocity is constant; vy is zero at the apex; acceleration is always g downward; vertical displacement is quadratic in time."},
{q:"Motion component classification",intro:"Choose the motion component each description applies to.",rows:["Motion has constant velocity (zero acceleration).","Motion is influenced by gravity near Earth's surface.","Time t is shared by the horizontal and vertical equations.","Speed increases at a constant linear rate throughout the whole trajectory."],opts:["Horizontal motion","Vertical motion","Both","Neither"],a:[0,1,2,3],e:"Horizontal velocity is constant; gravity acts vertically; time links both components. Neither component has speed increasing linearly throughout the entire flight."},
{q:"Impact of air resistance",intro:"Compared with the ideal model, choose how each property changes when significant drag is included.",rows:["Maximum height reached.","Horizontal range achieved.","Steepness of the descent angle at landing.","Symmetry of the trajectory shape."],opts:["Increases","Decreases","Remains unchanged"],a:[1,1,0,1],e:"Drag lowers height and range, makes descent steeper, and reduces symmetry."},
{q:"Velocity and acceleration vectors",intro:"For a 45-degree parabolic arc, classify the angle between velocity v and acceleration a.",rows:["Immediately after launch, while ascending.","At the apex.","During descent after the peak.","Immediately after the top of a purely vertical launch."],opts:["Parallel","Perpendicular","Oblique angle (< 90 degrees)","Oblique angle (> 90 degrees)"],a:[3,1,2,0],e:"During ascent the angle exceeds 90 degrees; at an oblique arc's apex vectors are perpendicular; during descent it is acute. Just after the top of a vertical launch, velocity and acceleration are both downward."},
{q:"Level ground versus elevated launch",intro:"Choose where each property applies.",rows:["Ascent time to apex equals descent time to landing.","Maximum height above launch point is h_rel = -uy^2/(2g).","Impact speed equals initial launch speed u.","Horizontal acceleration ax equals zero."],opts:["Level-ground launch","Elevated launch","Both","Neither"],a:[0,2,0,2],e:"Equal launch and landing heights give symmetry and equal impact speed. Vertical height gained depends only on uy and g; ideal horizontal acceleration is zero in both cases."},
{q:"Formula identification",intro:"Match each formula to its physical quantity.",rows:["t = -uy/g","vy = uy + g*t","h = y0 - uy^2/(2g)","x_max = u^2 sin(2theta)/(-g)"],opts:["Maximum height from ground","Level-ground range","Time to apex","Vertical velocity at time t"],a:[2,3,0,1],e:"These are the time-to-apex, vertical velocity, maximum height above ground, and level-ground range expressions."},
{q:"Spreadsheet simulation commands",intro:"Match each Excel command with its function.",rows:["=RADIANS(B4)","=$D$4","=25*COS(C4)","=SQRT(B10*B10+C10*C10)"],opts:["Convert angle to radians","Calculate initial horizontal velocity","Absolute cell reference for g","Compute total velocity magnitude"],a:[0,2,1,3],e:"RADIANS converts units; dollar signs make an absolute reference; COS resolves horizontal speed; SQRT computes magnitude."},
{q:"Compare 30-degree and 60-degree launches",intro:"For equal launch speeds over level ground, compare the value at 60 degrees with the value at 30 degrees.",rows:["Maximum height h.","Total flight time.","Horizontal range.","Initial horizontal velocity ux."],opts:["Greater than","Equal to","Less than"],a:[0,0,1,2],e:"The 60-degree launch has greater vertical speed, hence greater height and airtime. Complementary angles give equal range; cos(60) is smaller than cos(30)."},

const MODES={select:"Multiple selection",matrix:"Matrix grid statements",fill:"Fill in the blank"};
const state={mode:"select",index:0,checked:Array(20).fill(false),correct:Array(20).fill(false),responses:Array(20).fill(null)};
const $=id=>document.getElementById(id);
const safeText=(value)=>String(value);
function formatPhysics(value){return safeText(value).replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replace(/\btheta\b/gi,"&theta;").replace(/\b([uva])([xy])\b/g,"$1<sub>$2</sub>").replace(/\b(x|t)_(max|flight|peak)\b/g,"$1<sub>$2</sub>").replace(/\^2\b/g,"<sup>2</sup>").replace(/\binverse tan\b/gi,"tan<sup>-1</sup>").replace(/\bsqrt\b/gi,"&radic;")}
function pickedAnswer(q){
 if(state.mode==="select")return [...document.querySelectorAll("input[name=choice]:checked")].map(el=>Number(el.value)).sort((a,b)=>a-b);
 if(state.mode==="matrix")return [...document.querySelectorAll(".matrix-select")].map(el=>el.value===""?null:Number(el.value));
 return [$("blankInput").value.trim()];
}
function isCorrect(q,answer){
 if(state.mode==="select")return answer.length===q.a.length&&answer.every((v,i)=>v===q.a[i]);
 if(state.mode==="matrix")return answer.length===q.a.length&&answer.every((v,i)=>v===q.a[i]);
 const norm=s=>s.toLowerCase().replace(/[°]/g," degrees").replace(/\s+/g," ").replace(/[×·]/g,"*").trim();
 return q.a.some(item=>norm(answer[0])===norm(item));
}
function makeChoice(label,index,checked){const row=document.createElement("label");row.className="choice";const control=document.createElement("input");control.type=state.mode==="select"?"checkbox":"radio";control.name=state.mode==="select"?"choice":"single-choice";control.value=index;control.checked=checked;const letter=document.createElement("span");letter.className="letter";letter.textContent=String.fromCharCode(65+index);const text=document.createElement("span");if(/\b(?:[uva][xy]|theta|sin|cos|sqrt|inverse tan)|_[a-z]+|\^\d/.test(label))text.className="math-text";text.innerHTML=formatPhysics(label);row.append(control,letter,text);return row}
function render(){
 const items=BANK[state.mode],q=items[state.index],wasChecked=state.checked[state.index];
 $("modeLabel").textContent=MODES[state.mode];$("progressText").textContent=`Question ${state.index+1} of ${items.length}`;$("qIndex").textContent=`${state.mode==="select"?"Multiple selection":state.mode==="matrix"?"Matrix evaluation":"Fill in the blank"} · ${String(state.index+1).padStart(2,"0")}`;
 $("questionText").innerHTML=formatPhysics(q.q);$("helper").textContent=state.mode==="select"?"Select every correct option. There may be more than one.":state.mode==="matrix"?q.intro:"Type the missing term or expression, then check your answer.";
 const percent=wasChecked?((state.index+1)/items.length)*100:(state.index/items.length)*100;$("progressFill").style.width=`${percent}%`;$("progress").setAttribute?.("aria-valuenow",String(state.index+Number(wasChecked)));
 const host=$("answers");host.innerHTML="";
 if(state.mode==="select")q.o.forEach((option,i)=>{const response=state.responses[state.index]||[];const row=makeChoice(option,i,response.includes(i));if(wasChecked){row.querySelector("input").disabled=true;if(!state.correct[state.index]&&q.a.includes(i))row.classList.add("answer-correct");if(response.includes(i)&&!q.a.includes(i))row.classList.add("answer-wrong")}host.appendChild(row)});
 else if(state.mode==="matrix"){host.className="answers matrix";q.rows.forEach((text,i)=>{const row=document.createElement("div");row.className="matrix-row";const prompt=document.createElement("div");prompt.className="matrix-statement";const index=document.createElement("span");index.className="matrix-index";index.textContent=`${i+1}.`;prompt.append(index);const statement=document.createElement("span");statement.innerHTML=formatPhysics(text);prompt.append(statement);const select=document.createElement("select");select.className="matrix-select";select.setAttribute("aria-label",`Statement ${i+1}: ${text}`);const empty=document.createElement("option");empty.value="";empty.textContent="Choose classification";select.appendChild(empty);q.opts.forEach((opt,j)=>{const option=document.createElement("option");option.value=j;option.textContent=opt;select.appendChild(option)});if(wasChecked){const response=state.responses[state.index];select.value=String(response[i]);select.disabled=true;if(response[i]===q.a[i])row.classList.add("answer-correct");else{row.classList.add("answer-wrong");const correction=document.createElement("span");correction.className="answer-correction";correction.textContent=`Correct answer: ${q.opts[q.a[i]]}`;prompt.appendChild(correction)}}row.append(prompt,select);host.appendChild(row)})}
 else{host.className="answers";const wrap=document.createElement("label");wrap.className="blank-wrap";wrap.htmlFor="blankInput";const input=document.createElement("input");input.id="blankInput";input.className="blank-input";input.type="text";input.autocomplete="off";input.setAttribute("aria-label","Your answer");input.value=state.responses[state.index]?.[0]||"";input.disabled=wasChecked;wrap.appendChild(input);if(wasChecked&&!state.correct[state.index]){const key=document.createElement("span");key.className="answer-key";key.textContent=`Answer: ${q.a[0]}`;wrap.appendChild(key)}host.appendChild(wrap)}
 if(state.mode!=="matrix"&&state.mode!=="fill")host.className="answers";
 const feedback=$("feedback");feedback.hidden=!wasChecked;feedback.className=`feedback${wasChecked&&!state.correct[state.index]?" incorrect":""}`;if(wasChecked){feedback.innerHTML="";const strong=document.createElement("strong");strong.textContent=state.correct[state.index]?"Correct":"Not quite. The correct answer is shown below.";const exp=document.createElement("p");exp.textContent=q.e;feedback.append(strong,exp);if(!state.correct[state.index]){const answer=document.createElement("p");answer.className="answer-correction";if(state.mode==="select")answer.textContent=`Correct choices: ${q.a.map(index=>String.fromCharCode(65+index)).join(", ")}`;else if(state.mode==="matrix")answer.textContent="Correct classifications are shown beside each statement.";else answer.textContent=`Accepted answer: ${q.a[0]}`;feedback.appendChild(answer)}}
 $("checkBtn").disabled=wasChecked;$("prevBtn").disabled=state.index===0;$("nextBtn").textContent=state.index===items.length-1?"Finish section":"Next";
 const grid=$("numberGrid");grid.innerHTML="";items.forEach((_,i)=>{const button=document.createElement("button");button.className="number-button";button.textContent=String(i+1);button.setAttribute("aria-label",`Question ${i+1}${state.checked[i]?state.correct[i]?", correct":", incorrect":", not checked"}`);if(i===state.index)button.classList.add("current");if(state.checked[i])button.classList.add(state.correct[i]?"done":"missed");button.onclick=()=>{state.index=i;render()};grid.appendChild(button)});
 const score=state.correct.filter(Boolean).length;$("scoreText").textContent=`${score} / ${state.checked.filter(Boolean).length} correct`;$("practice").hidden=false;$("completion").hidden=true;
}
function check(){if(state.checked[state.index])return;const q=BANK[state.mode][state.index],answer=pickedAnswer(q);if(state.mode==="matrix"&&answer.some(v=>v===null)){alert("Choose a classification for each statement first.");return}if(state.mode==="fill"&&!answer[0]){$("blankInput").focus();return}if(state.mode==="select"&&!answer.length){alert("Select at least one option first.");return}state.responses[state.index]=answer;state.checked[state.index]=true;state.correct[state.index]=isCorrect(q,answer);render()}
function finish(){const items=BANK[state.mode];const total=items.length;const correct=state.correct.filter(Boolean).length;const checked=state.checked.filter(Boolean).length;const incorrect=checked-correct;const unanswered=total-checked;const accuracy=checked?Math.round(correct/checked*100):0;const review=$("completion");review.innerHTML="";const kicker=document.createElement("div");kicker.className="eyebrow";kicker.textContent=`${MODES[state.mode]} · ${checked===total?"complete":"report"}`;const title=document.createElement("h2");title.textContent="Result Summary Report";const description=document.createElement("p");description.textContent=checked===total?`Section complete. You answered all ${total} questions.`:`Section paused. Accuracy is based on ${checked} attempted question${checked===1?"":"s"}.`;const reportGrid=document.createElement("div");reportGrid.className="report-grid";[["Score",`${correct} / ${total}`],["Accuracy",`${accuracy}%`],["Correct",correct],["Incorrect",incorrect],["Unanswered",unanswered]].forEach(([label,value],index)=>{const metric=document.createElement("div");metric.className=`report-metric${index===0?" score":""}`;const name=document.createElement("span");name.textContent=label;const result=document.createElement("strong");result.textContent=value;metric.append(name,result);reportGrid.appendChild(metric)});review.append(kicker,title,description,reportGrid);
 const missed=items.map((q,i)=>({q,i})).filter(({i})=>state.checked[i]&&!state.correct[i]);if(missed.length){const heading=document.createElement("h3");heading.textContent="Review missed questions";review.appendChild(heading);const list=document.createElement("div");list.className="review-list";missed.forEach(({q,i})=>{const details=document.createElement("details");details.className="review-item";const summary=document.createElement("summary");summary.textContent=`${i+1}. ${q.q}`;const explanation=document.createElement("p");explanation.textContent=q.e;details.append(summary,explanation);if(state.mode==="matrix"){const ans=document.createElement("p");ans.textContent=q.rows.map((row,j)=>`${j+1}. ${row} — ${q.opts[q.a[j]]}`).join("\n");ans.style.whiteSpace="pre-line";details.appendChild(ans)}else if(state.mode==="select"){const ans=document.createElement("p");ans.textContent=`Correct choices: ${q.a.map(index=>String.fromCharCode(65+index)).join(", ")}`;details.appendChild(ans)}else{const ans=document.createElement("p");ans.className="right";ans.textContent=`Accepted answer: ${q.a[0]}`;details.appendChild(ans)}list.appendChild(details)});review.appendChild(list)}
 const actions=document.createElement("div");actions.className="action-group";const retry=document.createElement("button");retry.className="button primary";retry.textContent="Restart this section";retry.onclick=()=>reset(state.mode);const other=document.createElement("button");other.className="button";other.textContent="Practice another type";other.onclick=()=>setMode(state.mode==="select"?"matrix":state.mode==="matrix"?"fill":"select");actions.append(retry,other);review.appendChild(actions);$("practice").hidden=true;review.hidden=false;$("progressText").textContent="Section complete";$("progressFill").style.width="100%";
}
function reset(mode){state.mode=mode;state.index=0;state.checked=Array(20).fill(false);state.correct=Array(20).fill(false);state.responses=Array(20).fill(null);document.querySelectorAll(".mode-tab").forEach(tab=>tab.setAttribute("aria-selected",String(tab.dataset.mode===mode)));render()}
function setMode(mode){reset(mode);window.scrollTo({top:0,behavior:"smooth"})}
document.querySelectorAll(".mode-tab").forEach(tab=>tab.addEventListener("click",()=>setMode(tab.dataset.mode)));
$("checkBtn").addEventListener("click",check);$("prevBtn").addEventListener("click",()=>{if(state.index>0){state.index--;render()}});$("nextBtn").addEventListener("click",()=>{if(state.index<BANK[state.mode].length-1){state.index++;render()}else finish()});
render();
</script>
