<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aung Thura Htoo | GED Math Practice</title>
  <style>
    body { margin: 0; font-family: system-ui; background: #f4f7fb; color: #1d2433; }
    .wrap { max-width: 900px; margin: 0 auto; padding: 48px 20px 64px; }
    .card { background: white; border-radius: 20px; box-shadow: 0 18px 52px rgba(15, 23, 42, 0.09); padding: 32px; }
    h1 { margin-top: 0; font-size: clamp(2rem, 5vw, 3rem); }
    .pill { display: inline-block; padding: 6px 12px; border-radius: 999px; background: #ecfdf5; color: #0f766e; font-weight: 700; margin-bottom: 14px; }
    p { line-height: 1.7; color: #526073; }
    .facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; margin-top: 22px; }
    .fact { background: #f8fafc; border: 1px solid #e4ebf4; border-radius: 14px; padding: 16px; }
    .fact strong { display: block; font-size: 1.4rem; margin-bottom: 6px; }
    .cta { display: inline-block; margin-top: 24px; text-decoration: none; background: linear-gradient(135deg, #d4a437, #f0ce72); color: #172033; font-weight: 900; padding: 12px 18px; border-radius: 12px; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <div class="pill">GED Math Practice</div>
      <h1>Aung Thura Htoo</h1>
      <p>Welcome to the GED Math practice page for Aung Thura Htoo. This public page is ready to share and use as a study landing page.</p>
      <div class="facts">
        <div class="fact"><strong>100</strong>Questions</div>
        <div class="fact"><strong>Mixed</strong>Topics</div>
        <div class="fact"><strong>Review</strong>Missed items</div>
      </div>
      <a href="../" class="cta">Back to homepage</a>
    </div>
  </div>
</body>
</html>
