<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aung Thura Htoo | GED Math Practice</title>
  <style>
    :root { --bg: #f4f7fb; --card: #ffffff; --accent: #0f8f83; --gold: #c7961d; --text: #1d2433; --muted: #5f6d82; --shadow: rgba(15, 23, 42, 0.12); }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      background: linear-gradient(135deg, #eff7ff, #f9f6ee);
      color: var(--text); font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }
    .card {
      width: min(760px, calc(100vw - 32px));
      background: var(--card); border: 1px solid rgba(15, 143, 131, 0.15);
      border-radius: 24px; box-shadow: 0 18px 52px var(--shadow); padding: 32px 28px;
      text-align: center;
    }
    .badge {
      display: inline-block; padding: 7px 12px; border-radius: 999px; background: #ecfdf5; border: 1px solid #cfe9df; color: #13755a; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; font-size: 0.7rem;
    }
    h1 { margin: 14px 0 12px; font-size: clamp(2rem, 5vw, 3.2rem); letter-spacing: -0.05em; }
    p { color: var(--muted); font-size: 1.08rem; line-height: 1.7; margin: 0 auto 24px; max-width: 600px; }
    .cta {
      display: inline-block; text-decoration: none; background: linear-gradient(135deg, var(--gold), #f4d77a); color: #122030; font-weight: 900; padding: 14px 22px; border-radius: 12px; box-shadow: 0 12px 18px rgba(199, 150, 29, 0.2);
    }
    .meta { margin-top: 18px; color: var(--muted); font-size: 0.92rem; }
  </style>
</head>
<body>
  <main class="card">
    <div class="badge">Live public site</div>
    <h1>Aung Thura Htoo</h1>
    <p>GED Math Practice website is ready and publicly hosted. This page is set up for easy access and sharing.</p>
    <a class="cta" href="./alexgedmath/">Open GED Math Practice</a>
    <div class="meta">GitHub Pages • Public URL available after deployment</div>
  </main>
</body>
</html>
